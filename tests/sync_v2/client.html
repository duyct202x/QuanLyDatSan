<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thiết bị giả lập</title>
  <script>
    // Mỗi iframe = 1 thiết bị: IndexedDB/outbox/deviceId tách riêng theo namespace
    const params = new URLSearchParams(location.search);
    window.__SMASH_DEVICE_NS__ = params.get('ns') + ':';
    window.__offline = false;
    window.__skew = 0;
    const realNow = Date.now.bind(Date);
    Date.now = () => realNow() + window.__skew;
    window.fetch = (url, init) => window.__offline
      ? Promise.reject(new TypeError('Failed to fetch'))
      : parent.fakeServerFetch(url, init);
  </script>
  <script src="../../js/data.js"></script>
  <script src="../../js/sync-core.js"></script>
  <script src="../../js/auth-core.js"></script>
  <script src="../../js/local-db.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/html-safe.js"></script>
  <script src="../../js/modules/vote-scheduler.js"></script>
  <script src="../../js/modules/membership.js"></script>
</head>
<body></body>
</html>
