<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#041a15" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Shuttlecock Feather Gradient -->
    <linearGradient id="featherGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a7f3d0" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shuttlecock Spine Lines -->
    <linearGradient id="spineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Cork Base Gradient -->
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cork Collar Gradient -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Motion Glow & Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (App Icon Box) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Light Orbs Inside -->
  <circle cx="256" cy="230" r="140" fill="#10b981" opacity="0.15" filter="url(#strongGlow)" />
  <circle cx="360" cy="150" r="90" fill="#06b6d4" opacity="0.2" filter="url(#strongGlow)" />

  <!-- Motion Speed Lines / Impact Streaks -->
  <g opacity="0.75" stroke-linecap="round">
    <line x1="90" y1="360" x2="160" y2="330" stroke="#34d399" stroke-width="5" opacity="0.6" />
    <line x1="110" y1="410" x2="200" y2="370" stroke="#06b6d4" stroke-width="7" opacity="0.8" />
    <line x1="160" y1="445" x2="230" y2="415" stroke="#38bdf8" stroke-width="5" opacity="0.5" />
    <!-- Dynamic Energy Arc -->
    <path d="M 120 390 A 180 180 0 0 0 390 120" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-dasharray="8 12" opacity="0.4" />
  </g>

  <!-- Badminton Shuttlecock (Angled Dynamic Flight 40 degrees) -->
  <g transform="translate(256, 245) rotate(-38) translate(-256, -245)">
    
    <!-- Outer Glow Silhouette -->
    <path d="M 190 140 L 322 140 L 278 280 L 234 280 Z" fill="#34d399" opacity="0.25" filter="url(#glow)" />

    <!-- Shuttlecock Feathers Main Body (Fan Shape) -->
    <!-- Feather Ribs / Panels -->
    <!-- Left Wing -->
    <path d="M 188 135 C 196 170 220 250 234 278 L 244 278 C 230 240 206 160 198 135 Z" fill="url(#featherGrad)" opacity="0.92" />
    <path d="M 204 130 C 212 165 228 245 238 278 L 248 278 C 238 245 222 165 214 130 Z" fill="url(#featherGrad)" />
    <!-- Center Left -->
    <path d="M 224 125 C 228 165 236 245 244 278 L 254 278 C 246 245 238 165 234 125 Z" fill="#ffffff" />
    <!-- Center Main Spine -->
    <path d="M 250 122 C 251 165 252 245 254 278 L 258 278 C 260 245 261 165 262 122 Z" fill="#ffffff" filter="url(#glow)" />
    <!-- Center Right -->
    <path d="M 278 125 C 274 165 266 245 258 278 L 268 278 C 276 245 284 165 288 125 Z" fill="#ffffff" />
    <!-- Right Wing -->
    <path d="M 298 130 C 290 165 274 245 264 278 L 274 278 C 284 245 300 165 308 130 Z" fill="url(#featherGrad)" />
    <path d="M 314 135 C 306 170 282 250 268 278 L 278 278 C 292 240 316 160 324 135 Z" fill="url(#featherGrad)" opacity="0.92" />

    <!-- Translucent Feather Overlays & Top Rim Arch -->
    <path d="M 188 135 C 220 120 292 120 324 135 L 316 142 C 286 128 226 128 196 142 Z" fill="#e0f2fe" opacity="0.95" />

    <!-- Cross Rib Threads (Double binding lines) -->
    <!-- Lower Thread -->
    <path d="M 218 225 C 238 232 274 232 294 225" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" />
    <path d="M 218 225 C 238 232 274 232 294 225" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Upper Thread -->
    <path d="M 204 180 C 230 190 282 190 308 180" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <path d="M 204 180 C 230 190 282 190 308 180" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Cork Collar (Red / Emerald Sports Band) -->
    <rect x="234" y="278" width="44" height="12" rx="3" fill="url(#collarGrad)" />
    <rect x="238" y="280" width="36" height="3" rx="1.5" fill="#fca5a5" opacity="0.8" />

    <!-- Cork Base (Hemispherical High Quality Cork Head) -->
    <path d="M 234 290 C 234 322 278 322 278 290 Z" fill="url(#corkGrad)" stroke="#b45309" stroke-width="2" />
    
    <!-- Cork Gloss / 3D Specular Highlight -->
    <ellipse cx="250" cy="298" rx="8" ry="4" fill="#ffffff" opacity="0.65" transform="rotate(-15 250 298)" />
  </g>

  <!-- Smash Lightning / Speed Star Accents -->
  <g fill="#fef08a" opacity="0.95" filter="url(#glow)">
    <polygon points="380,85 385,100 400,105 385,110 380,125 375,110 360,105 375,100" />
    <polygon points="415,165 418,175 428,178 418,181 415,191 412,181 402,178 412,175" />
    <polygon points="105,270 108,280 118,283 108,286 105,296 102,286 92,283 102,280" />
  </g>
</svg>
